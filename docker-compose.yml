services:
  postgres:
    image: postgres:16-alpine
    container_name: magic-portfolio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio_user
      POSTGRES_PASSWORD: portfolio_password
      POSTGRES_DB: magic_portfolio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio_user -d magic_portfolio"]
      interval: 10s
      timeout: 5s
      retries: 5

  garage:
    image: dxflrs/garage:v2.1.0
    container_name: magic-portfolio-garage
    restart: unless-stopped
    ports:
      - "3900:3900" # S3 API
      - "3901:3901" # Garage RPC
      - "3902:3902" # S3 web endpoint
      - "3903:3903" # Admin API
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "node", "id", "-q"]
      interval: 30s
      timeout: 10s
      retries: 3

  garage-init:
    build:
      context: .
      dockerfile: Dockerfile.garage-init
    container_name: magic-portfolio-garage-init
    depends_on:
      garage:
        condition: service_healthy
    environment:
      GARAGE_CONFIG_FILE: /etc/garage-init.toml
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-GK0123456789abcdef01234567}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-portfolio-images}
      S3_ENDPOINT: http://garage:3900
      S3_REGION: ${S3_REGION:-garage}
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-/api/images}
    volumes:
      - ./garage-init.toml:/etc/garage-init.toml:ro
      - garage_meta:/var/lib/garage/meta:ro
    restart: "no"

volumes:
  postgres_data:
  garage_meta:
  garage_data:
